# Bootable appliance: rootfs packages + kernel + seatd + cage kiosk compositor.
name: appliance
suite: trixie
variant: minbase
architectures:
  - amd64
manifests:
  - base.txt
  - dotnet.txt
  - ui-graphics.txt
  - audio-alsa.txt
  - appliance.txt
omit_recommends: true
microsoft_packages: true
output: artifacts/novolis-os.qcow2
rootfs_output: artifacts/novolis-os-appliance-rootfs.tar.zst
